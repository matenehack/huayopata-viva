name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:calendar
      - run: npm run build
        env:
          BASE_PATH: /huayopata-viva/
      - uses: actions/upload-artifact@v4
        with:
          name: huayopata-viva-site
          path: dist
